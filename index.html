<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extras Calculator - Gemini Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e0f;
    --surface: #18181b;
    --surface2: #222226;
    --border: #2e2e34;
    --accent: #e8ff47;
    --accent-dim: rgba(232,255,71,0.12);
    --text: #f0f0f0;
    --muted: #888;
    --danger: #ff4f4f;
    --success: #47ffb2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  h1 span {
    color: var(--accent);
  }

  .actions {
    display: flex;
    gap: 0.75rem;
  }

  button {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.5rem 1rem;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:hover {
    background: var(--border);
    color: var(--text);
  }

  button.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 500;
  }

  button.primary:hover {
    background: #d4e53b;
  }

  .main-content {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr 320px;
    height: calc(100vh - 73px);
    overflow: hidden;
  }

  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1.5rem;
  }

  .panel:last-child {
    border-right: none;
    border-left: 1px solid var(--border);
  }

  .panel-title {
    font-size: 0.9rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  input, textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
    font-family: 'DM Mono', monospace;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .dropzone {
    border: 2px dashed var(--border);
    padding: 2rem;
    text-align: center;
    border-radius: 4px;
    cursor: pointer;
    background: var(--bg);
    transition: border-color 0.2s;
    margin-top: 0.5rem;
  }

  .dropzone:hover {
    border-color: var(--accent);
  }

  .dropzone p {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .files-list {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.35rem 0.5rem;
    background: var(--surface2);
    border-radius: 3px;
    margin-top: 0.35rem;
  }

  .file-remove {
    cursor: pointer;
    color: var(--danger);
  }

  .results-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .results-header {
    background: var(--surface2);
    padding: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .results-total {
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
  }

  .results-body {
    flex: 1;
    padding: 1.5rem;
    overflow-y: auto;
  }

  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .card-title {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .card-content {
    font-size: 0.95rem;
    white-space: pre-wrap;
    font-family: 'DM Mono', monospace;
  }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.5rem;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 2px;
    font-size: 0.75rem;
    margin-right: 0.35rem;
  }

  .error {
    color: var(--danger);
    background: rgba(255,79,79,0.08);
    border: 1px solid rgba(255,79,79,0.2);
    padding: 1rem;
    border-radius: 4px;
    margin-top: 1rem;
    font-size: 0.85rem;
  }

  .history-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 0.75rem;
    border-radius: 4px;
    margin-bottom: 0.5rem;
    cursor: pointer;
  }

  .history-card:hover {
    border-color: var(--accent);
  }

  .h-vehicle {
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .h-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.35rem;
  }

  .h-total {
    color: var(--accent);
    font-family: 'DM Mono', monospace;
  }

  .history-empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 2rem 0;
  }

  .overlay-loading {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(14,14,15,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    z-index: 9999;
    font-size: 0.9rem;
    color: var(--accent);
    display: none;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div id="loading" class="overlay-loading">
  <div class="spinner"></div>
  <div>Επεξεργασία μέσω Gemini API...</div>
</div>

<header>
  <h1><span>Gemini</span> Extras Calculator</h1>
  <div class="actions">
    <button onclick="clearHistory()">Καθαρισμός Ιστορικού</button>
    <button class="primary" onclick="runAnalysis()">Εκτέλεση Ανάλυσης</button>
  </div>
</header>

<main class="main-content">
  <div class="panel">
    <div class="panel-title">Δεδομένα Οχήματος</div>
    
    <div class="form-group">
      <label for="vehicle-info">Όχημα (Μοντέλο - Πλαίσιο)</label>
      <input type="text" id="vehicle-info" value="Mercedes-Benz (VIN: WDD212...)">
    </div>

    <div class="form-group">
      <label for="pricelist-text">Τιμοκατάλογος (Κείμενο)</label>
      <textarea id="pricelist-text" placeholder="Κωδικός, Περιγραφή, Αξία..."></textarea>
    </div>

    <div class="form-group">
      <label>Αρχείο Τιμοκαταλόγου (PDF)</label>
      <div class="dropzone" onclick="document.getElementById('pricelist-file-input').click()">
        <p>Πατήστε εδώ για να ανεβάσετε το PDF του τιμοκαταλόγου</p>
        <input type="file" id="pricelist-file-input" style="display:none" onchange="handleFileSelect(event, 'pricelist')">
      </div>
      <div id="pricelist-files-list" class="files-list"></div>
    </div>

    <div class="form-group">
      <label>Datacard (Έγγραφο / Εικόνα οχήματος)</label>
      <div class="dropzone" onclick="document.getElementById('datacard-file-input').click()">
        <p>Πατήστε εδώ για να ανεβάσετε το αρχείο της Datacard</p>
        <input type="file" id="datacard-file-input" style="display:none" onchange="handleFileSelect(event, 'datacard')">
      </div>
      <div id="datacard-files-list" class="files-list"></div>
    </div>

    <div class="form-group">
      <label for="custom-prompt">Επιπλέον Οδηγίες (System Prompt)</label>
      <textarea id="custom-prompt" placeholder="Γράψτε εδώ επιπλέον οδηγίες αν χρειάζεται..."></textarea>
    </div>
  </div>

  <div class="panel">
    <div class="results-wrapper">
      <div class="results-header">
        <div class="panel-title" style="margin:0">Αποτελέσματα</div>
        <div id="results-total" class="results-total">0,00 €</div>
      </div>
      <div class="results-body">
        <div id="results-container">
          <div style="color:var(--muted); font-size:0.85rem;">Δεν έχει πραγματοποιηθεί ανάλυση. Συμπληρώστε τα στοιχεία και πατήστε "Εκτέλεση".</div>
        </div>
        <div id="error-container" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Ιστορικό</div>
    <div id="history-list"></div>
  </div>
</main>

<script>
  let uploadedPricelists = [];
  let uploadedDatacards = [];

  document.addEventListener("DOMContentLoaded", () => {
    renderHistory();
  });

  function handleFileSelect(e, type) {
    const files = e.target.files;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const reader = new FileReader();
      
      reader.onload = (event) => {
        const fileData = {
          name: file.name,
          type: file.type.startsWith('image') ? 'image' : 'document',
          media_type: file.type,
          data: event.target.result.split(',')[1]
        };

        if (type === 'pricelist') {
          uploadedPricelists.push(fileData);
        } else {
          uploadedDatacards.push(fileData);
        }
        
        renderFileList();
      };
      
      reader.readAsDataURL(file);
    }
  }

  function renderFileList() {
    const pList = document.getElementById('pricelist-files-list');
    const dList = document.getElementById('datacard-files-list');

    pList.innerHTML = uploadedPricelists.map((f, i) => `
      <div class="file-item">
        <span>${f.name}</span>
        <span class="file-remove" onclick="removeFile('pricelist', ${i})">✕</span>
      </div>
    `).join('');

    dList.innerHTML = uploadedDatacards.map((f, i) => `
      <div class="file-item">
        <span>${f.name}</span>
        <span class="file-remove" onclick="removeFile('datacard', ${i})">✕</span>
      </div>
    `).join('');
  }

  function removeFile(type, index) {
    if (type === 'pricelist') {
      uploadedPricelists.splice(index, 1);
    } else {
      uploadedDatacards.splice(index, 1);
    }
    renderFileList();
  }

  async function runAnalysis() {
    const loading = document.getElementById('loading');
    loading.style.display = 'flex';

    const vehicle = document.getElementById('vehicle-info').value;
    const pricelistText = document.getElementById('pricelist-text').value;
    const customPrompt = document.getElementById('custom-prompt').value;

    let content = [];
    
    content.push({
      type: 'text',
      text: `Όχημα: ${vehicle}\n\nΤιμοκατάλογος:\n${pricelistText}\n\nΟδηγίες:`
    });

    uploadedPricelists.forEach(f => {
      content.push({
        type: f.type,
        source: {
          media_type: f.media_type,
          data: f.data
        }
      });
    });

    uploadedDatacards.forEach(f => {
      content.push({
        type: f.type,
        source: {
          media_type: f.media_type,
          data: f.data
        }
      });
    });

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          system: customPrompt || '',
          messages: [{ role: 'user', content }]
        })
      });

      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.error || 'Αποτυχία επικοινωνίας με το API.');
      }

      const rawText = data.content[0].text;
      const parsedData = JSON.parse(rawText);

      displayResults(parsedData);
      saveToHistory({
        vehicle: vehicle,
        date: new Date().toISOString(),
        total: parsedData.total || 0,
        data: parsedData
      });
    } catch (err) {
      document.getElementById('results-container').innerHTML = '';
      document.getElementById('results-total').textContent = '0,00 €';
      document.getElementById('error-container').style.display = 'block';
      document.getElementById('error-container').innerHTML = `<div class="error">Σφάλμα: ${err.message}</div>`;
    } finally {
      loading.style.display = 'none';
    }
  }

  function displayResults(data) {
    document.getElementById('error-container').style.display = 'none';
    
    let total = Number(data.total) || 0;
    document.getElementById('results-total').textContent = total.toLocaleString('el-GR', { style: 'currency', currency: 'EUR' });

    let html = `
      <div class="card">
        <div class="card-title">Αναγνωρισμένα Extras (Datacard)</div>
        <div class="card-content">
          ${(data.extras || []).map(e => `<div>• <b>${e.code || e.name}</b>: ${e.description || ''} <span style="float:right">${Number(e.price || 0).toLocaleString('el-GR', {style:'currency',currency:'EUR'})}</span></div>`).join('')}
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">Πακέτα</div>
        <div class="card-content">
          ${(data.packages || []).map(p => `<div>• <b>${p.name || p.code}</b>: <span style="float:right">${Number(p.price || 0).toLocaleString('el-GR', {style:'currency',currency:'EUR'})}</span></div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-title">Μη αναγνωρισμένα / not_found</div>
        <div class="card-content" style="color:var(--danger)">
          ${(data.not_found || []).map(item => `<div>• ${item}</div>`).join('') || 'Κανένα'}
        </div>
      </div>
    `;

    document.getElementById('results-container').innerHTML = html;
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem('extras_history') || '[]'); } catch { return []; }
  }

  function saveToHistory(entry) {
    const h = getHistory();
    h.unshift(entry);
    if (h.length > 50) h.pop();
    localStorage.setItem('extras_history', JSON.stringify(h));
    renderHistory();
  }

  function clearHistory() {
    if (!confirm('Να διαγραφεί το ιστορικό;')) return;
    localStorage.removeItem('extras_history');
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    const h = getHistory();
    if (!h.length) {
      list.innerHTML = '<div class="history-empty">Δεν υπάρχουν<br>αναλύσεις ακόμα.</div>';
      return;
    }
    list.innerHTML = h.map((entry, i) => `
      <div class="history-card" onclick="loadHistory(${i})">
        <div class="h-vehicle">${entry.vehicle || 'Άγνωστο όχημα'}</div>
        <div class="h-meta">
          <span class="h-date">${new Date(entry.date).toLocaleDateString('el-GR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
          <span class="h-total">${Number(entry.total).toLocaleString('el-GR',{style:'currency',currency:'EUR'})}</span>
        </div>
      </div>
    `).join('');
  }

  function loadHistory(index) {
    const h = getHistory();
    const entry = h[index];
    if (entry && entry.data) {
      document.getElementById('vehicle-info').value = entry.vehicle;
      displayResults(entry.data);
    }
  }
</script>

</body>
</html>
